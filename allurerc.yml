# Allure 3 report configuration (picked up automatically by `mvn allure:report` / `allure:serve`).
# Allure 3 reads failure categories from here, not from categories.json in allure-results.
name: SauceDemo UI Tests

# Keep the trend of the last N runs (history.jsonl grows by one line per report)
historyLimit: 20

# First matching rule wins, so the specific "Test defects" rule goes before the generic "Broken".
categories:
  - name: Product defects
    # Assertion failed: the application behaves differently than expected
    matchedStatuses: [failed]

  - name: Test defects
    # Test code problem: locator timeout, wrong state, bad test data
    matchedStatuses: [broken]
    traceRegex: '[\s\S]*(TimeoutError|NullPointerException|IllegalStateException|IllegalArgumentException|ClassCastException|IndexOutOfBoundsException)[\s\S]*'

  - name: Broken
    # Any other unexpected error: browser crash, network, environment
    matchedStatuses: [broken]

  - name: Ignored tests
    matchedStatuses: [skipped]
