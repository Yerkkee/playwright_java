# Base URL of the application under test
base.url=https://www.saucedemo.com

# Supported: chromium, firefox, webkit
browser=chromium

# Run browser without UI (true for CI, false for local debug)
headless=false

# Slow down each Playwright action by N ms (0 = disabled, useful for demo)
slow.mo=500

# Default timeout for locator actions (click, fill, etc.)
default.timeout=10000

# Timeout for page.navigate()
navigation.timeout=30000

viewport.width=1920
viewport.height=1080

# Take screenshot on test failure
screenshot.on.failure=true

# Record Playwright trace on failure (opens in trace viewer)
trace.on.failure=true

# Record video on failure
video.on.failure=false