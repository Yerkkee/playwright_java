# Default test configuration.
# Every key can be overridden by a JVM system property (-Dkey=value)
# or an environment variable (KEY_NAME, dots -> underscores, upper case).
# Defaults are CI-friendly; for local debugging use e.g. -Dheadless=false -Dslow.mo=500

# Application under test
base.url=https://www.saucedemo.com
# Public demo password shown on the SauceDemo login page; overridable like any other key
user.password=secret_sauce

# Browser: chromium | firefox | webkit
browser=chromium
headless=true

# Delay in ms added to every Playwright action (0 = disabled)
slow.mo=0

viewport.width=1920
viewport.height=1080

# Timeouts in ms
# Locator actions and assertions (click, fill, assertThat ...)
default.timeout=10000
# page.navigate(), waiting for load
navigation.timeout=30000

# Artifacts attached to Allure when a test FAILS (passed tests keep nothing)
screenshot.on.failure=true
trace.on.failure=true
video.on.failure=true
